<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Страница переехала — rules.omnisgm.com</title>
<script>
(function () {
  var p = location.pathname;
  var m = p.match(/^\/ttrpg_srd_markdown\/(en\/)?(.*)$/);
  if (!m) return;
  var lang = m[1] ? 'en' : 'ru';
  var segs = m[2].split('/').filter(Boolean).map(function (s) {
    return s.replace(/^\d+_/, '').replace(/([a-z0-9])([A-Z])/g, '$1-$2').replace(/_/g, '-').toLowerCase();
  });
  if (segs[0] === 'dnd-v2') segs[0] = 'dnd';
  location.replace('https://rules.omnisgm.com/' + lang + '/' + segs.join('/') + (segs.length ? '/' : ''));
})();
</script>
</head>
<body>
<p>Сайт переехал: <a href="https://rules.omnisgm.com/">rules.omnisgm.com</a></p>
</body>
</html>
